services:
  mongodb:
    image: mongo:7.0
    container_name: collab-planner-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: collab-planner-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  plan-service:
    build:
      context: .
      dockerfile: apps/plan-service/Dockerfile
    container_name: collab-planner-plan-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/collab_planner
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  realtime-service:
    build:
      context: .
      dockerfile: apps/realtime-service/Dockerfile
    container_name: collab-planner-realtime-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/collab_planner
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    container_name: collab-planner-ai-worker
    environment:
      - REDIS_URI=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: collab-planner-web
    ports:
      - "3000:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: collab-planner-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - plan-service
      - realtime-service
      - web
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
