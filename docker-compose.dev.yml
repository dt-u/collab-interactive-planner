services:
  mongodb:
    image: mongo:7.0
    container_name: collab-planner-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: collab-planner-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: collab-planner-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d.dev:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mongo_data_dev:
  redis_data_dev:
